# Publishes a release. Two ways in:
#
# - Usually: merging the pull request from prepare-release.yaml, i.e. a push to main
#   titled "chore(release): vX.Y.Z" that changes __version__ to that
#   version, which has no tag yet.
# - By hand: pushing a version tag (git tag v1.2.3 && git push origin v1.2.3); the
#   tag must match __version__ at that commit.
#
# It builds the Docker image for amd64 and arm64 and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/<repo>:1.2.3, :1.2, :1, :latest and :next (a
# pre-release such as 1.2.3-rc.1 gets its exact tag and :next), then creates the tag
# (if needed) and the
# GitHub release with the version's section of CHANGELOG.md as notes.
#
# The image is built without the build cache: a release shouldn't depend on cache
# entries other workflow runs wrote.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is this a release?
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous commit and the tags
          persist-credentials: false

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(python3 scripts/release.py current)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag is $GITHUB_REF_NAME, but the version is $version"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # On main only the release pull request publishes, not any change of
          # __version__
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          case "$title" in
            "chore(release): v$version" | "chore(release): v$version "*) ;;
            *)
              echo "Not a release commit ($title): nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare with: nothing to release (push a tag to release by hand)."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          before=$(git show "$BEFORE:marqueefin/__init__.py" 2>/dev/null | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          if [ "$before" = "$version" ]; then
            echo "Version unchanged ($version): nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $before -> $version: releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag and the GitHub release
      packages: write # the image on ghcr.io
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store it with the repository
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, so missing notes fail before anything is published
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes --github "$VERSION" > "$RUNNER_TEMP/notes.md"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Named after the repository, lowercase
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The version comes from marqueefin/__init__.py (a push to main has no tag to read it from).
      # Pre-releases get only the exact tag and :next, never :latest, :1 or :1.2.
      # :next follows every release, candidates and final ones (npm's dist-tag idea):
      # testers get each candidate and move on to the final version by themselves.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=next

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # gh attestation verify oci://ghcr.io/<owner>/<repo>:1.2.3 --owner <owner>
      # (public repositories only)
      - name: Build provenance attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Tags here, in the same run: a tag pushed with this token wouldn't start a workflow again
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --title "Marqueefin $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            set -- "$@" --verify-tag
          else
            set -- "$@" --target "$GITHUB_SHA"
          fi
          gh release create "v$VERSION" "$@"
