# SonarQube Cloud: the code analysis with the coverage of CI's tests, for main and for
# pull requests. It runs after CI in the base repository, so pull requests from forks
# are analyzed too (their own runs get no secrets). Their code is checked out only for
# the scanner to read, nothing from it runs, and of their CI artifacts only the coverage
# reports are taken.
# Needs the secret SONAR_TOKEN and the variables SONAR_ORGANIZATION, SONAR_PROJECT_KEY;
# without the token it does nothing.
name: SonarQube Cloud
run-name: SonarQube Cloud for ${{ github.event.workflow_run.display_title }}

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the pull request's code is only read, see above
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: sonar-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  scan:
    name: Analysis
    runs-on: ubuntu-24.04
    # Pushes to main and pull requests, not the manual runs on release branches
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      contains(fromJSON('["push", "pull_request"]'), github.event.workflow_run.event)
    permissions:
      contents: read # the checkout (a private repository can't be read without it)
      actions: read # the CI run's coverage reports
      pull-requests: read # the pull request of the commit
    steps:
      # The pull request comes from the API by the commit, not from the run's data
      - name: What to analyze
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' }}
          ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          PROJECT: ${{ vars.SONAR_PROJECT_KEY }}
          EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$TOKEN_SET" != true ]; then
            echo "::notice::No SONAR_TOKEN secret: the analysis is skipped"
            exit 0
          fi
          if [ -z "$ORGANIZATION" ] || [ -z "$PROJECT" ]; then
            echo "::error::Set the variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          args="-Dsonar.organization=$ORGANIZATION -Dsonar.projectKey=$PROJECT"
          if [ "$EVENT" = pull_request ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
              --json number,headRefOid,headRefName,baseRefName \
              --jq "map(select(.headRefOid == \"$SHA\")) | first // empty
                | \"\(.number) \(.baseRefName) \(.headRefName)\"")
            if [ -z "$pr" ]; then
              echo "::notice::No open pull request has $SHA as its head (closed or pushed again): skipped"
              exit 0
            fi
            read -r number base head <<< "$pr"
            # The branch name is only a label in SonarQube Cloud; a fork's could be anything
            [[ "$head" =~ ^[A-Za-z0-9._/-]+$ ]] || head="pr-$number"
            args="$args -Dsonar.pullrequest.key=$number -Dsonar.pullrequest.base=$base -Dsonar.pullrequest.branch=$head"
            echo "### Pull request #$number ($head → $base)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.args
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # blame, and main to compare a pull request with
          persist-credentials: false
          allow-unsafe-pr-checkout: true # only read by the scanner, see the top

      # main's analyses carry the version, so SonarQube Cloud marks each release; with
      # "New Code" set to "Previous version", new code is what came since the last one
      - name: Version (main)
        id: version
        if: steps.target.outputs.args && github.event.workflow_run.event == 'push'
        run: |
          version=$(sed -nE 's/^__version__ = "([0-9A-Za-z.+-]+)"$/\1/p' marqueefin/__init__.py)
          if [ -n "$version" ]; then
            echo "args=-Dsonar.projectVersion=$version" >> "$GITHUB_OUTPUT"
            echo "### main at $version" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: CI's coverage reports
        if: steps.target.outputs.args
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a CI run that failed early has none; analyze without them
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: coverage-*
          path: ${{ runner.temp }}/ci

      # Only the three report files, into the places sonar-project.properties names
      - name: Coverage into place
        if: steps.target.outputs.args
        run: |
          for pair in coverage-python/coverage.xml:coverage/python/coverage.xml \
                      coverage-js/lcov.info:coverage/js/lcov.info \
                      coverage-e2e/lcov.info:coverage/e2e/lcov.info; do
            from="$RUNNER_TEMP/ci/${pair%%:*}" to="${pair#*:}"
            if [ -f "$from" ] && [ ! -L "$from" ]; then
              mkdir -p "$(dirname "$to")" && cp "$from" "$to"
            else
              echo "::warning::No ${pair%%:*} from CI: analyzed without that coverage"
            fi
          done

      - name: Analysis
        if: steps.target.outputs.args
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.target.outputs.args }} ${{ steps.version.outputs.args }}
