# Vulnerability scan of the published :latest between releases, into the Security tab
# Results go to the Security tab (code scanning)
name: Image scan
run-name: Image scan of :latest (${{ github.event_name == 'schedule' && '(weekly)' || '(manual)' }})

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan the published image
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: image
