# Weekly check that the links in the Markdown files still work
name: Links
run-name: Link check (${{ github.event_name == 'schedule' && '(weekly)' || '(manual)' }})

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          fail: true
          token: ${{ github.token }} # fewer rate limits on github.com links
