version: "0.2"
language: en
useGitignore: true
import:
  - "@cspell/dict-de-de/cspell-ext.json"
  - "@cspell/dict-fr-fr/cspell-ext.json"
  - "@cspell/dict-es-es/cspell-ext.json"
ignoreRegExpList:
  - uses:\s*\S+
overrides:
  - filename: "**/.github/workflows/*.yaml"
    dictionaries:
      - shell
      - bash
  - filename:
      - "**/src/i18n/de.json"
      - "**/tests/js/*.mjs"
      - "**/tests/e2e/i18n.spec.mjs"
    language: en,de,fr,es
  - filename: "**/src/i18n/fr.json"
    language: en,fr
  - filename: "**/src/i18n/es.json"
    language: en,es
ignorePaths:
  - .git/**
  - build/**
  - LICENSE
  - .husky/_/**
  - .vscode/extensions.json
  - .marqueefin_cache/**
  - collection.html
  - "*_posters/**"
  - secrets/**
  - .env
  - node_modules/**
  - package-lock.json
  - .venv/**
  - CODE_OF_CONDUCT.md
