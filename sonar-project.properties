# SonarQube Cloud, analyzed in CI (.github/workflows/ci.yaml) with the test coverage.
# Organization and project key come from the repository's variables.
sonar.sources=export.py,marqueefin,src,scripts,docker
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Written by CI's test jobs, downloaded by its sonar job
sonar.python.coverage.reportPaths=coverage/python/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info,coverage/e2e/lcov.info
sonar.coverage.exclusions=export.py,scripts/**/*.mjs,docker/**

# Not applied: these taint rules treat the command line as written by an untrusted AI
# agent. Here paths and arguments come from whoever runs the exporter or a dev script,
# on their own machine, like any command-line tool; git runs without a shell.
sonar.issue.ignore.multicriteria=llmPath,llmCommand
sonar.issue.ignore.multicriteria.llmPath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.llmPath.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.llmCommand.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.llmCommand.resourceKey=**/*.py
